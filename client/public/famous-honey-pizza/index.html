          <section style="margin: 30px 0;">
            <h2 style="color: #d4af37; font-size: 2em; margin-bottom: 15px;">What Is Jack's Famous Honey Pizza?</h2>
            <p>Jack's Famous Honey Pizza is the signature creation of Jack's Lounge in Hyannis, Massachusetts. It's a hand-tossed pizza topped with freshly shredded mozzarella cheese and finished with a generous drizzle of golden honey. The combination of savory melted cheese and sweet honey creates a one-of-a-kind flavor that has kept Cape Cod locals coming back for over 60 years.</p>
            
            <p>Jack Sances opened Jack's Lounge in 1963 with this honey pizza as the centerpiece of the menu. The DiPrete family purchased the restaurant in 1985 and preserved the original recipe. Today, Grace and Tim DiPrete continue the tradition — the same recipe, the same Hyannis location, the same loyal customers.</p>
          </section>

            <p><strong>Can I get it gluten-free?</strong><br>Yes! Any 10" pizza can be prepared on a gluten-free crust for an additional $4.00.</p>
